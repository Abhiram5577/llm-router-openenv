[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-router-env"
version = "1.0.0"
description = "Llama Inference Gateway SLA Controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "gymnasium==0.29.1",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "gradio>=4.0.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
server = "server.app:main"